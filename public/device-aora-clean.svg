<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Metallic shell gradient -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="25%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="75%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>

    <!-- Translucent inner shell -->
    <linearGradient id="innerShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>

    <!-- PCB dark background -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <!-- Gold pad gradient -->
    <radialGradient id="goldGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6e1c"/>
    </radialGradient>

    <!-- Coil copper gradient -->
    <linearGradient id="coilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6b800"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>

    <!-- Battery silver gradient -->
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Glow for live dot -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Mask for inner area -->
    <clipPath id="innerClip">
      <path d="M 240,120 
               C 380,120 440,200 440,320 
               C 440,420 400,520 380,600 
               C 370,650 360,700 340,720 
               C 320,740 280,740 260,720 
               C 240,700 230,650 220,600 
               C 210,540 200,480 200,420 
               C 200,360 210,300 220,240 
               C 225,200 230,160 240,120 Z" />
    </clipPath>
  </defs>

  <!-- Main device group with shadow -->
  <g filter="url(#shadow)">
    <!-- Outer translucent shell -->
    <path d="M 220,80 
             C 400,80 480,180 480,320 
             C 480,440 440,560 410,650 
             C 390,720 370,760 320,760 
             C 270,760 240,720 220,650 
             C 200,580 180,500 180,420 
             C 180,340 190,260 205,180 
             C 212,130 200,80 220,80 Z" 
          fill="url(#shellGrad)" 
          stroke="#c0c0c0" 
          stroke-width="2"
          opacity="0.95"/>

    <!-- Inner edge highlight -->
    <path d="M 225,85 
             C 395,85 475,185 475,320 
             C 475,435 435,555 405,645 
             C 385,710 365,750 320,750 
             C 275,750 245,710 225,645 
             C 205,575 185,495 185,420 
             C 185,340 195,260 210,180 
             C 217,135 208,85 225,85 Z" 
          fill="none" 
          stroke="rgba(255,255,255,0.6)" 
          stroke-width="3"/>

    <!-- Outer rim highlight -->
    <path d="M 215,75 
             C 405,75 490,175 490,320 
             C 490,445 450,565 420,655 
             C 400,730 375,770 320,770 
             C 265,770 235,730 215,655 
             C 195,585 175,505 175,420 
             C 175,335 185,255 200,175 
             C 208,125 195,75 215,75 Z" 
          fill="none" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="1.5"/>

    <!-- PCB background visible through shell -->
    <path d="M 240,120 
             C 380,120 440,200 440,320 
             C 440,420 400,520 380,600 
             C 370,650 360,700 340,720 
             C 320,740 280,740 260,720 
             C 240,700 230,650 220,600 
             C 210,540 200,480 200,420 
             C 200,360 210,300 220,240 
             C 225,200 230,160 240,120 Z" 
          fill="url(#pcbGrad)"/>

    <!-- PCB Components -->
    <!-- Main chips -->
    <rect x="260" y="200" width="45" height="45" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <rect x="265" y="205" width="35" height="35" rx="2" fill="#1f1f1f"/>
    <text x="267" y="225" fill="#888" font-size="6" font-family="monospace">A1</text>

    <rect x="320" y="180" width="35" height="35" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <rect x="324" y="184" width="27" height="27" rx="2" fill="#1f1f1f"/>

    <rect x="280" y="280" width="40" height="30" rx="2" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <rect x="283" y="283" width="34" height="24" rx="1" fill="#1f1f1f"/>

    <rect x="340" y="240" width="30" height="30" rx="2" fill="#2a2a2a" stroke="#444" stroke-width="1"/>

    <!-- Small passive components -->
    <rect x="250" y="260" width="12" height="6" fill="#c4a35a"/>
    <rect x="270" y="260" width="8" height="4" fill="#8a6e1c"/>
    <rect x="300" y="265" width="10" height="5" fill="#c4a35a"/>
    <rect x="330" y="270" width="6" height="6" fill="#8a6e1c"/>
    <rect x="250" y="300" width="8" height="4" fill="#c4a35a"/>
    <rect x="270" y="310" width="12" height="5" fill="#8a6e1c"/>
    <rect x="300" y="320" width="6" height="8" fill="#c4a35a"/>
    <rect x="250" y="340" width="10" height="4" fill="#8a6e1c"/>
    <rect x="270" y="350" width="8" height="6" fill="#c4a35a"/>
    <rect x="310" y="340" width="12" height="4" fill="#8a6e1c"/>
    <rect x="340" y="330" width="6" height="6" fill="#c4a35a"/>
    <rect x="250" y="380" width="6" height="8" fill="#8a6e1c"/>
    <rect x="270" y="390" width="10" height="5" fill="#c4a35a"/>
    <rect x="300" y="380" width="8" height="6" fill="#8a6e1c"/>
    <rect x="330" y="390" width="12" height="4" fill="#c4a35a"/>
    <rect x="250" y="420" width="8" height="4" fill="#c4a35a"/>
    <rect x="270" y="430" width="6" height="8" fill="#8a6e1c"/>
    <rect x="300" y="440" width="10" height="5" fill="#c4a35a"/>
    <rect x="330" y="430" width="8" height="4" fill="#8a6e1c"/>
    <rect x="250" y="460" width="12" height="4" fill="#c4a35a"/>
    <rect x="280" y="470" width="6" height="8" fill="#8a6e1c"/>
    <rect x="310" y="470" width="10" height="5" fill="#c4a35a"/>
    <rect x="340" y="470" width="8" height="4" fill="#8a6e1c"/>
    <rect x="250" y="500" width="8" height="6" fill="#c4a35a"/>
    <rect x="270" y="510" width="10" height="4" fill="#8a6e1c"/>
    <rect x="300" y="510" width="6" height="8" fill="#c4a35a"/>
    <rect x="320" y="510" width="12" height="4" fill="#8a6e1c"/>

    <!-- Tiny solder pads / vias -->
    <circle cx="245" cy="250" r="2" fill="#555"/>
    <circle cx="245" cy="270" r="2" fill="#555"/>
    <circle cx="245" cy="290" r="2" fill="#555"/>
    <circle cx="245" cy="310" r="2" fill="#555"/>
    <circle cx="245" cy="330" r="2" fill="#555"/>
    <circle cx="245" cy="350" r="2" fill="#555"/>
    <circle cx="245" cy="370" r="2" fill="#555"/>
    <circle cx="245" cy="390" r="2" fill="#555"/>
    <circle cx="245" cy="410" r="2" fill="#555"/>
    <circle cx="245" cy="430" r="2" fill="#555"/>
    <circle cx="245" cy="450" r="2" fill="#555"/>
    <circle cx="245" cy="470" r="2" fill="#555"/>
    <circle cx="245" cy="490" r="2" fill="#555"/>
    <circle cx="245" cy="510" r="2" fill="#555"/>
    <circle cx="245" cy="530" r="2" fill="#555"/>

    <circle cx="395" cy="250" r="2" fill="#555"/>
    <circle cx="395" cy="270" r="2" fill="#555"/>
    <circle cx="395" cy="290" r="2" fill="#555"/>
    <circle cx="395" cy="310" r="2" fill="#555"/>
    <circle cx="395" cy="330" r="2" fill="#555"/>
    <circle cx="395" cy="350" r="2" fill="#555"/>
    <circle cx="395" cy="370" r="2" fill="#555"/>
    <circle cx="395" cy="390" r="2" fill="#555"/>
    <circle cx="395" cy="410" r="2" fill="#555"/>
    <circle cx="395" cy="430" r="2" fill="#555"/>
    <circle cx="395" cy="450" r="2" fill="#555"/>
    <circle cx="395" cy="470" r="2" fill="#555"/>
    <circle cx="395" cy="490" r="2" fill="#555"/>
    <circle cx="395" cy="510" r="2" fill="#555"/>
    <circle cx="395" cy="530" r="2" fill="#555"/>

    <!-- Fine copper traces (simplified) -->
    <path d="M 250,220 L 250,240 M 260,220 L 260,240 M 270,220 L 270,240 M 280,220 L 280,240 M 290,220 L 290,240" 
          stroke="#b87333" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M 250,340 L 250,360 M 260,340 L 260,360 M 270,340 L 270,360 M 280,340 L 280,360" 
          stroke="#b87333" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M 250,460 L 250,480 M 260,460 L 260,480 M 270,460 L 270,480 M 280,460 L 280,480" 
          stroke="#b87333" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M 330,220 L 330,240 M 340,220 L 340,240 M 350,220 L 350,240 M 360,220 L 360,240" 
          stroke="#b87333" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M 330,340 L 330,360 M 340,340 L 340,360 M 350,340 L 350,360 M 360,340 L 360,360" 
          stroke="#b87333" stroke-width="0.8" fill="none" opacity="0.6"/>

    <!-- Battery -->
    <rect x="270" y="370" width="70" height="24" rx="3" fill="url(#batteryGrad)" stroke="#999" stroke-width="1"/>
    <rect x="272" y="372" width="66" height="20" rx="2" fill="none" stroke="#aaa" stroke-width="0.5" opacity="0.5"/>
    <text x="275" y="386" fill="#666" font-size="5" font-family="sans-serif" font-weight="bold" letter-spacing="0.5">Li-ion</text>

    <!-- Wireless Charging Coil -->
    <g transform="translate(300, 540)">
      <rect x="-35" y="-20" width="70" height="40" rx="8" fill="none" stroke="url(#coilGrad)" stroke-width="2.5"/>
      <rect x="-28" y="-15" width="56" height="30" rx="6" fill="none" stroke="url(#coilGrad)" stroke-width="2"/>
      <rect x="-21" y="-10" width="42" height="20" rx="4" fill="none" stroke="url(#coilGrad)" stroke-width="1.5"/>
      <rect x="-14" y="-5" width="28" height="10" rx="2" fill="none" stroke="url(#coilGrad)" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#e6b800"/>
    </g>

    <!-- Gold Contact Pads (EEG Electrodes) -->
    <g>
      <!-- Pad 1 -->
      <circle cx="290" cy="640" r="14" fill="url(#goldGrad)" stroke="#b8860b" stroke-width="1.5"/>
      <circle cx="290" cy="640" r="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <circle cx="290" cy="640" r="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
      
      <!-- Pad 2 -->
      <circle cx="330" cy="660" r="14" fill="url(#goldGrad)" stroke="#b8860b" stroke-width="1.5"/>
      <circle cx="330" cy="660" r="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <circle cx="330" cy="660" r="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
      
      <!-- Pad 3 -->
      <circle cx="360" cy="690" r="14" fill="url(#goldGrad)" stroke="#b8860b" stroke-width="1.5"/>
      <circle cx="360" cy="690" r="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <circle cx="360" cy="690" r="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
    </g>

    <!-- Optical sensor window -->
    <ellipse cx="360" cy="710" rx="8" ry="12" fill="#111" stroke="#333" stroke-width="1"/>
    <ellipse cx="360" cy="710" rx="5" ry="8" fill="#0a0a0a"/>
    <circle cx="358" cy="706" r="1.5" fill="#ff3333" opacity="0.8"/>
    <circle cx="362" cy="714" r="1.5" fill="#3333ff" opacity="0.6"/>

    <!-- Small LED indicator -->
    <circle cx="240" cy="150" r="3" fill="#00ff88" filter="url(#glow)" opacity="0.9"/>

    <!-- Screw bosses -->
    <circle cx="260" cy="110" r="6" fill="#c0c0c0" stroke="#999" stroke-width="1"/>
    <circle cx="260" cy="110" r="3" fill="#777"/>
    
    <circle cx="410" cy="200" r="6" fill="#c0c0c0" stroke="#999" stroke-width="1"/>
    <circle cx="410" cy="200" r="3" fill="#777"/>
    
    <circle cx="390" cy="600" r="6" fill="#c0c0c0" stroke="#999" stroke-width="1"/>
    <circle cx="390" cy="600" r="3" fill="#777"/>
    
    <circle cx="250" cy="680" r="6" fill="#c0c0c0" stroke="#999" stroke-width="1"/>
    <circle cx="250" cy="680" r="3" fill="#777"/>

    <!-- Top curved end detail -->
    <path d="M 440,180 C 450,160 460,140 450,120 C 440,100 420,95 400,100" 
          fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 445,185 C 455,165 465,145 455,125 C 445,105 425,100 405,105" 
          fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-linecap="round"/>

    <!-- Bottom curved end detail -->
    <path d="M 380,730 C 360,750 340,755 320,750 C 300,745 280,730 270,710" 
          fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtle AORA branding on shell -->
  <text x="260" y="160" fill="rgba(255,255,255,0.25)" font-size="8" font-family="sans-serif" font-weight="bold" letter-spacing="2" transform="rotate(-15 260 160)">AORA</text>
</svg>
